{% extends "empleados/base.html" %}

{% block titulo %}Eliminar departamento | Sistema de empleados{% endblock %}

{% block contenido %}
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card border-danger shadow-sm">
                <div class="card-header bg-danger text-white">
                    <h1 class="h5 mb-0">Confirmar eliminación</h1>
                </div>

                <div class="card-body p-4 text-center">
                    <div class="alert alert-warning" role="alert">
                        Esta acción no se puede deshacer.
                    </div>

                    <p class="mb-4">
                        ¿Deseas eliminar el departamento
                        <strong>{{ departamento.nombre }}</strong>?
                    </p>

                    <form method="post" class="d-inline">
                        {% csrf_token %}
                        <button class="btn btn-danger" type="submit">
                            Sí, eliminar departamento
                        </button>
                    </form>

                    <a
                        class="btn btn-outline-secondary"
                        href="{% url 'empleados:lista_departamentos' %}"
                    >
                        Cancelar
                    </a>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
