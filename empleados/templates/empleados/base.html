<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Sistema de empleados{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background-color: #0a4275;">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="{% url 'empleados:lista_departamentos' %}">
                Sistema de empleados
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'empleados:lista_departamentos' %}">
                            Departamentos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'empleados:lista_empleados' %}">
                            Empleados
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4 flex-grow-1">
        {% if messages %}
            {% for message in messages %}
                <div
                    class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show"
                    role="alert"
                    data-auto-dismiss
                >
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block contenido %}{% endblock %}
    </main>

    <footer class="text-center text-white mt-5" style="background-color: #0a4275;">
        <div class="text-center py-2 small" style="background-color: rgba(0, 0, 0, 0.2);">
            © {% now "Y" %} Sistema de empleados · Desarrollado por Tu nombre
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.querySelectorAll("[data-auto-dismiss]").forEach(function (alerta) {
            setTimeout(function () {
                bootstrap.Alert.getOrCreateInstance(alerta).close();
            }, 2000);
        });
    </script>

</body>
</html>
